<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>Hệ thống QLCL Bệnh viện Quân y 103</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', '"Open Sans"', '"Helvetica Neue"', 'sans-serif'],
          },
          fontSize: {
            'title': ['20px', { lineHeight: '1.25', fontWeight: '800' }],
            'main-title': ['17.33px', { lineHeight: '1.25', fontWeight: '800' }],
            'section': ['16px', { lineHeight: '1.4', fontWeight: '700' }],
            'subtitle': ['11px', { lineHeight: '1.5', fontWeight: '700' }],
            'label': ['13px', { lineHeight: '1.5', fontWeight: '600' }],
            'input': ['14px', { lineHeight: '1.6' }],
            'table': ['13px', { lineHeight: '1.5' }],
            'small': ['14px', { lineHeight: '1.4' }],
          },
          colors: {
            primary: {
              50: '#f1fdf3',
              100: '#dcfce4',
              200: '#bcf7ca',
              300: '#8df0a6',
              400: '#53e179',
              500: '#2cc955',
              600: '#149132',
              700: '#137a2d',
              800: '#146128',
              900: '#125023',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    }

    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Global Table Border Styles */
    .table-standardized {
      width: 100%;
      border-collapse: collapse !important;
      border: 1px solid #cbd5e1 !important;
    }

    .table-standardized thead th {
      background-color: #009900 !important;
      color: white !important;
      border: 1px solid #cbd5e1 !important;
      padding: 10px 16px !important;
      text-align: left;
      text-transform: uppercase !important;
      font-size: 12px !important;
      font-weight: 800 !important;
      white-space: nowrap;
    }

    .table-standardized tbody td {
      border: 1px solid #cbd5e1 !important;
      padding: 12px 16px !important;
      vertical-align: top;
      font-size: 13px !important;
      font-weight: 400 !important;
    }

    .table-standardized tbody tr:hover {
      background-color: #f8fafc !important;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">
  <div id="root">
    <div
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #64748b;">
      <div
        style="width: 40px; height: 40px; border: 4px solid #f1f5f9; border-top: 4px solid #009900; border-radius: 50%; animation: spin 1s linear infinite;">
      </div>
      <p style="margin-top: 16px; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em;">
        Đang tải hệ thống...</p>
    </div>
  </div>
  <style>
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <!-- Zalo in-app browser detection: runs as classic script BEFORE modules -->
  <script>
      (function () {
        var ua = navigator.userAgent || '';
        var isZalo = /Zalo/i.test(ua);
        // Also detect other common in-app browsers that may fail
        var isInApp = /FBAN|FBAV|Instagram|Line\//i.test(ua);

        if (isZalo || isInApp) {
          var currentUrl = window.location.href;
          // Stop all further loading
          document.getElementById('root').innerHTML = '';
          document.body.style.margin = '0';
          document.body.style.padding = '0';
          document.body.style.background = '#f8fafc';
          document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;">' +
            '<div style="background:white;max-width:400px;width:100%;border-radius:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.15);overflow:hidden;">' +
            '<div style="height:6px;background:#009900;"></div>' +
            '<div style="padding:32px;text-align:center;">' +
            '<div style="width:64px;height:64px;margin:0 auto 20px;background:#f0fdf4;border-radius:16px;display:flex;align-items:center;justify-content:center;">' +
            '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#009900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>' +
            '</div>' +
            '<h2 style="font-size:20px;font-weight:900;color:#0f172a;margin:0 0 8px;text-transform:uppercase;letter-spacing:-0.025em;">Mở bằng trình duyệt</h2>' +
            '<p style="font-size:14px;color:#64748b;line-height:1.6;margin:0 0 24px;">Trình duyệt trong ứng dụng không hỗ trợ đầy đủ. Vui lòng mở bằng trình duyệt hệ thống.</p>' +

            '<div style="background:#f8fafc;border-radius:16px;padding:20px;border:1px solid #e2e8f0;margin-bottom:24px;text-align:left;">' +
            '<p style="font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:0.1em;margin:0 0 12px;">HƯỚNG DẪN</p>' +
            '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">' +
            '<div style="width:32px;height:32px;min-width:32px;background:white;border:1px solid #e2e8f0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;">⋮</div>' +
            '<p style="font-size:13px;font-weight:600;color:#334155;margin:0;">Nhấn dấu <b style="color:#009900">⋮</b> hoặc <b style="color:#009900">...</b> ở góc trên</p>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:12px;">' +
            '<div style="width:32px;height:32px;min-width:32px;background:white;border:1px solid #e2e8f0;border-radius:8px;display:flex;align-items:center;justify-content:center;">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#009900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
            '</div>' +
            '<p style="font-size:13px;font-weight:600;color:#334155;margin:0;">Chọn <b style="color:#009900">"Mở bằng trình duyệt"</b></p>' +
            '</div>' +
            '</div>' +

            '<a href="' + currentUrl + '" target="_blank" rel="noopener" style="display:block;width:100%;padding:14px;background:#009900;color:white;border-radius:14px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;text-decoration:none;text-align:center;box-shadow:0 10px 15px -3px rgba(0,153,0,0.2);">Thử mở bằng trình duyệt</a>' +
            '<p style="font-size:10px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;margin:20px 0 0;">Bệnh viện Quân y 103</p>' +
            '</div>' +
            '</div>' +
            '</div>';
          // Prevent module script from loading
          throw new Error('Zalo/InApp browser detected - showing fallback UI');
        }
      })();
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
