<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <base href="/" />
  <title>Bệnh viện Quân y 103 - Khảo sát hài lòng</title>
  
  <!-- Preload styles for faster loading -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://supabase.co" crossorigin>

  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isZalo = /Zalo/i.test(ua);
      var isAndroidWebView = /; wv\)/i.test(ua);
      var isInApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Viber|WeChat|MicroMessenger|KakaoTalk|Snapchat|Twitter|BytedanceWebview|TikTok|Telegram|Pinterest|Messenger|ZaloBrowser/i.test(ua);

      if (isZalo || isAndroidWebView || isInApp) {
        window.__INAPP_DETECTED = true;
        // Store flag in sessionStorage so React can show overlay
        sessionStorage.setItem('inapp_browser_detected', 'true');
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Fallback handler if Tailwind CDN fails
    window.addEventListener('load', () => {
      if (!window.tailwind) {
        // Simple fallback styles if Tailwind doesn't load
        const style = document.createElement('style');
        style.textContent = `
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; color: #0f172a; }
          #root { width: 100%; }
          .animate-spin { animation: spin 1s linear infinite; }
          @keyframes spin { 100% { transform: rotate(360deg); } }
        `;
        document.head.appendChild(style);
      }
    });
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#f1fdf3', 100: '#dcfce4', 200: '#bcf7ca', 300: '#8df0a6', 400: '#53e179', 500: '#2cc955', 600: '#149132', 700: '#137a2d', 800: '#146128', 900: '#125023',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .table-standardized {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #cbd5e1;
    }

    .table-standardized thead th {
      background-color: #009900;
      color: white;
      border: 1px solid #cbd5e1;
      padding: 10px 16px;
      text-align: left;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .table-standardized tbody td {
      border: 1px solid #cbd5e1;
      padding: 12px 16px;
      vertical-align: top;
      font-size: 13px;
      font-weight: 400;
    }

    .table-standardized tbody tr:hover {
      background-color: #f8fafc;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">
  <div id="root">
    <div
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #64748b;">
      <div
        style="width: 40px; height: 40px; border: 4px solid #f1f5f9; border-top: 4px solid #009900; border-radius: 50%; animation: spin 1s linear infinite;">
      </div>
      <p style="margin-top: 16px; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em;">
        Đang tải...</p>
    </div>
  </div>
  <style>
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>

  <script type="module" src="/index.tsx"></script>
  <noscript>
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;background:#f8fafc;">
      <div style="background:white;max-width:400px;width:100%;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.1);padding:40px;text-align:center;">
        <h2>JavaScript không được bật</h2><p>Vui lòng bật JavaScript để sử dụng ứng dụng này.</p>
      </div>
    </div>
  </noscript>
</body>

</html>
