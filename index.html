<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <base href="/" />
  <title>Bệnh viện Quân y 103 - Khảo sát hài lòng</title>

  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isZalo = /Zalo/i.test(ua);
      var isAndroidWebView = /; wv\)/i.test(ua);
      var isInApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Viber|WeChat|MicroMessenger|KakaoTalk|Snapchat|Twitter|BytedanceWebview|TikTok|Telegram|Pinterest|Messenger|ZaloBrowser/i.test(ua);

      if (isZalo || isAndroidWebView || isInApp) {
        window.__INAPP_DETECTED = true;
        var url = window.location.href;

        // Simple and robust intent generation
        var intent = url.replace(/^https?:\/\//, 'intent://') +
          '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
          encodeURIComponent(url) + ';end';

        // Use a hidden body + custom UI to prevent white flash first
        document.write('<style>body{display:none!important;}</style>');

        // Build a minimalist but clean UI
        var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mở bằng trình duyệt</title>' +
          '<style>body{margin:0;padding:24px;background:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;box-sizing:border-box;}' +
          '.box{background:white;width:100%;max-width:400px;border-radius:24px;padding:40px;box-shadow:0 20px 40px rgba(0,0,0,0.1);text-align:center;border-top:8px solid #009900;}' +
          'h2{margin:0 0 16px;color:#0f172a;text-transform:uppercase;font-size:20px;font-weight:900;letter-spacing:-0.5px;}' +
          'p{color:#64748b;margin:0 0 32px;font-size:15px;line-height:1.6;font-weight:500;}' +
          '.btn{display:block;width:100%;padding:16px;border-radius:16px;font-weight:800;text-decoration:none;font-size:13px;text-transform:uppercase;letter-spacing:1px;box-sizing:border-box;}' +
          '.btn-p{background:#009900;color:white;margin-bottom:12px;box-shadow:0 10px 20px rgba(0,153,0,0.2);}' +
          '.btn-s{border:2px solid #009900;color:#009900;}' +
          '.note{margin-top:24px;background:#f1fdf4;padding:16px;border-radius:16px;text-align:left;font-size:12px;color:#166534;line-height:1.5;}' +
          '</style></head><body><div class="box">' +
          '<h2>Vui lòng mở bằng Chrome</h2>' +
          '<p>Trình duyệt trong ứng dụng không hỗ trợ đầy đủ khảo sát. Bạn hãy chuyển sang Chrome để có trải nghiệm tốt nhất.</p>' +
          '<a href="' + intent + '" class="btn btn-p">NHẤN VÀO ĐÂY ĐỂ MỞ CHROME</a>' +
          '<a href="' + url + '" target="_blank" rel="noopener" class="btn btn-s">HOẶC MỞ TRÌNH DUYỆT KHÁC</a>' +
          '<div class="note"><b>Cách khác:</b> Nhấn vào dấu <b>(⋮)</b> hoặc <b>(...)</b> ở góc trên bên phải, sau đó chọn <b>"Mở bằng trình duyệt"</b>.</div>' +
          '<p style="margin:30px 0 0;font-size:10px;font-weight:900;letter-spacing:2px;color:#cbd5e1;">BỆNH VIỆN QUÂN Y 103</p>' +
          '</div></body></html>';

        document.open();
        document.write(html);
        document.close();

        // Stop current parser to prevent original app from loading
        if (window.stop) window.stop();
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#f1fdf3', 100: '#dcfce4', 200: '#bcf7ca', 300: '#8df0a6', 400: '#53e179', 500: '#2cc955', 600: '#149132', 700: '#137a2d', 800: '#146128', 900: '#125023',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .table-standardized {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #cbd5e1;
    }

    .table-standardized thead th {
      background-color: #009900;
      color: white;
      border: 1px solid #cbd5e1;
      padding: 10px 16px;
      text-align: left;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .table-standardized tbody td {
      border: 1px solid #cbd5e1;
      padding: 12px 16px;
      vertical-align: top;
      font-size: 13px;
      font-weight: 400;
    }

    .table-standardized tbody tr:hover {
      background-color: #f8fafc;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">
  <div id="root">
    <div
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #64748b;">
      <div
        style="width: 40px; height: 40px; border: 4px solid #f1f5f9; border-top: 4px solid #009900; border-radius: 50%; animation: spin 1s linear infinite;">
      </div>
      <p style="margin-top: 16px; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em;">
        Đang tải...</p>
    </div>
  </div>
  <style>
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>

  <script type="module" src="/index.tsx"></script>

  <script nomodule>
    if (!window.__INAPP_DETECTED) {
      document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;background:#f8fafc;">' +
        '<div style="background:white;max-width:400px;width:100%;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.1);padding:40px;text-align:center;">' +
        '<h2>Trình duyệt không hỗ trợ</h2><p>Vui lòng mở bằng Chrome để tiếp tục.</p></div></div>';
    }
  </script>
</body>

</html>
