<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <script>
    /**
     * CHUẨN HÓA URL & XÓA PARAM ZALO (PHƯƠNG PHÁP QUYẾT LIỆT)
     * Giúp khắc phục triệt để lỗi trắng trang trên Zalo Android
     */
    (function () {
      try {
        var url = new URL(window.location.href);
        var path = url.pathname;

        // Xóa query params của Zalo/FB để tránh lỗi định tuyến
        if (url.search && (url.search.indexOf('zarsrc') !== -1 || url.search.indexOf('utm_') !== -1 || url.search.indexOf('fbclid') !== -1)) {
          window.history.replaceState({}, '', path + url.hash);
        }
      } catch (e) { }
    })();
  </script>

  <title>Quản lý chất lượng Bệnh viện Quân y 103</title>

  <!-- PWA: cài ra màn hình chính, chạy toàn màn hình với logo app -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#059669" />
  <meta name="application-name" content="QLCL 103" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="QLCL 103" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Preload styles for faster loading -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://supabase.co" crossorigin>
  <!-- Polyfills and Shims for older browsers -->
  <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.1/dist/es-module-shims.js"></script>

  <script>
    /**
     * IN-APP BROWSER DETECTION
     */
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var isZalo = /Zalo/i.test(ua) || /ZaloBrowser/i.test(ua);
        var isAndroidWebView = /; wv\)/i.test(ua);
        if (isZalo || isAndroidWebView) {
          window.__INAPP_DETECTED = true;
          try { sessionStorage.setItem('inapp_browser_detected', 'true'); } catch (e) { }
        }
      } catch (err) { }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Fallback handler if Tailwind CDN fails
    window.addEventListener('load', () => {
      if (!window.tailwind) {
        // Simple fallback styles if Tailwind doesn't load
        const style = document.createElement('style');
        style.textContent = `
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; color: #0f172a; }
          #root { width: 100%; }
          .animate-spin { animation: spin 1s linear infinite; }
          @keyframes spin { 100% { transform: rotate(360deg); } }
        `;
        document.head.appendChild(style);
      }
    });
  </script>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Segoe UI', '-apple-system', 'BlinkMacSystemFont', 'Roboto', 'Arial', 'Helvetica', 'sans-serif'],
          },
          fontSize: {
            label: ['0.8125rem', { lineHeight: '1.35' }],
            input: ['1rem', { lineHeight: '1.45' }],
            table: ['0.8125rem', { lineHeight: '1.45' }],
            title: ['1.25rem', { lineHeight: '1.25', fontWeight: '800' }],
            'main-title': ['1.375rem', { lineHeight: '1.25' }],
          },
          colors: {
            primary: {
              50: '#eef9ee', 100: '#d7efd7', 200: '#b1dfb1', 300: '#80c980', 400: '#42af42', 500: '#159f15', 600: '#059669', 700: '#008800', 800: '#007700', 900: '#006600',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, Helvetica, sans-serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .table-standardized {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #cbd5e1;
    }

    .table-standardized thead th {
      background-color: #059669;
      color: white;
      border: 1px solid #cbd5e1;
      padding: 6px 8px;
      text-align: left;
      text-transform: uppercase;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 800;
      white-space: nowrap;
    }

    .table-standardized tbody td {
      border: 1px solid #cbd5e1;
      padding: 6px 8px;
      vertical-align: top;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 400;
    }

    .table-standardized tbody tr:hover {
      background-color: #f8fafc;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">
  <div id="root">
    <!-- MÀN HÌNH KHỞI ĐỘNG (SPLASH) - hiển thị logo ngay khi mở app, React sẽ thay thế khi tải xong -->
    <div id="app-splash"
      style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; font-family: 'Segoe UI', -apple-system, system-ui, sans-serif; padding: 24px; box-sizing: border-box;">
      <img src="/logo.png" alt="Logo Bệnh viện Quân y 103" width="112"
        height="112"
        style="width: 112px; height: 112px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(5,150,105,0.18)); animation: splashPulse 1.6s ease-in-out infinite;" />
      <h1
        style="margin: 22px 0 4px; font-size: 15px; font-weight: 800; color: #0f172a; text-transform: uppercase; letter-spacing: 0.06em; text-align: center; line-height: 1.3;">
        Hệ thống Quản lý Chất lượng</h1>
      <p
        style="margin: 0 0 24px; font-size: 12px; font-weight: 700; color: #059669; text-transform: uppercase; letter-spacing: 0.14em; text-align: center;">
        Bệnh viện Quân y 103</p>
      <div
        style="width: 34px; height: 34px; border: 3px solid #ecfdf5; border-top: 3px solid #059669; border-radius: 50%; animation: spin 0.9s linear infinite;">
      </div>
    </div>
  </div>
  <style>
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes splashPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.06);
        opacity: 0.85;
      }
    }
  </style>

  <script type="module" src="/index.tsx"></script>

  <script>
    /**
     * FAIL-SAFE MOUNT CHECK
     * If the app doesn't mount within 25 seconds, something is wrong.
     */
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.querySelector('#app-splash')) {
        console.error('❌ FAIL-SAFE: App failed to mount within timeout.');
        root.innerHTML = `
          <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; font-family:sans-serif; text-align:center; background:#f8fafc;">
            <div style="background:white; max-width:420px; width:100%; border-radius:32px; box-shadow:0 20px 50px rgba(0,0,0,0.05); padding:48px; border:1px solid #f1f5f9;">
              <div style="width:64px; height:64px; background:#fef2f2; border-radius:24px; display:flex; align-items:center; justify-content:center; margin:0 auto 24px;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
              </div>
              <h2 style="font-size:20px; font-weight:900; color:#1e293b; margin-bottom:12px; text-transform:uppercase; letter-spacing:-0.02em;">Lỗi tải ứng dụng</h2>
              <p style="font-size:14px; color:#64748b; line-height:1.6; margin-bottom:32px;">Trình duyệt của bạn có thể không tương thích hoặc kết nối mạng bị gián đoạn.</p>
              <button onclick="window.location.reload()" style="width:100%; padding:16px; background:#059669; color:white; border:none; border-radius:16px; font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:0.1em; cursor:pointer; box-shadow:0 10px 20px rgba(0,153,0,0.2);">Tải lại trang</button>
              <p style="margin-top:24px; font-size:11px; color:#94a3b8; font-weight:600;">Gợi ý: Hãy mở link này bằng Chrome hoặc Safari để có trải nghiệm tốt nhất.</p>
            </div>
          </div>
        `;
      }
    }, 25000);

    // Global error listener for debugging
    window.onerror = function (msg, url, line, col, error) {
      console.error('❌ GLOBAL ERROR:', msg, 'at', url, ':', line, ':', col);
      return false;
    };
  </script>

  <noscript>
    <div
      style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;background:#f8fafc;">
      <div
        style="background:white;max-width:400px;width:100%;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.1);padding:40px;text-align:center;">
        <h2>JavaScript không được bật</h2>
        <p>Vui lòng bật JavaScript để sử dụng ứng dụng này.</p>
      </div>
    </div>
  </noscript>
</body>

</html>
